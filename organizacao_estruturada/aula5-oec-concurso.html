<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz: Ética, Sustentabilidade e TI Verde</title>
    <style>
        /* CONFIGURAÇÕES GERAIS - Focado em leitura longa e conforto visual */
        :root {
            --bg-color: #f7f9fa;       /* Fundo claro suave, reduz a agressividade do branco puro */
            --card-bg: #ffffff;        /* Fundo dos cartões em branco puro para contraste */
            --text-main: #2d3748;      /* Texto principal em grafite escuro (menos cansativo que o preto total) */
            --text-muted: #5a6a85;     /* Texto secundário/pistas */
            --accent-color: #2b6cb0;   /* Azul sóbrio para elementos de ação */
            --accent-hover: #1a446c;
            --correct-color: #2f855a;  /* Verde oliva escuro para acertos */
            --incorrect-color: #c53030;/* Vermelho fosco para erros */
            --border-color: #e2e8f0;   /* Bordas suaves */
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            line-height: 1.7; /* Linha espaçada para leitura confortável */
            font-size: 18px;  /* Fonte ligeiramente maior para evitar fadiga ocular */
            padding: 40px 20px;
        }

        .container {
            max-width: 760px; /* Largura ideal para a fixação do olho durante a leitura */
            margin: 0 auto;
        }

        header {
            margin-bottom: 40px;
            text-align: center;
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 20px;
        }

        h1 {
            font-size: 2rem;
            color: #1a202c;
            margin-bottom: 10px;
            font-weight: 700;
        }

        .subtitle {
            color: var(--text-muted);
            font-size: 1.1rem;
        }

        /* CARD DE QUESTÃO */
        .quiz-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 30px;
            margin-bottom: 30px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
        }

        .question-number {
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--accent-color);
            font-weight: 600;
            margin-bottom: 8px;
        }

        .question-text {
            font-size: 1.2rem;
            font-weight: 600;
            margin-bottom: 20px;
            color: #1a202c;
        }

        /* OPÇÕES DE RESPOSTA */
        .options-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .option-label {
            display: flex;
            align-items: flex-start;
            padding: 14px 18px;
            border: 2px solid var(--border-color);
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .option-label:hover {
            border-color: var(--accent-color);
            background-color: #f0f7ff;
        }

        .option-label input[type="radio"] {
            margin-top: 6px;
            margin-right: 14px;
            min-width: 18px;
            min-height: 18px;
            accent-color: var(--accent-color);
        }

        /* SEÇÃO DE RESULTADOS */
        .submit-section {
            text-align: center;
            margin: 40px 0;
        }

        .btn-submit {
            background-color: var(--accent-color);
            color: white;
            border: none;
            padding: 16px 40px;
            font-size: 1.1rem;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.2s;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .btn-submit:hover {
            background-color: var(--accent-hover);
        }

        #result-panel {
            display: none;
            background-color: #edf2f7;
            border: 2px solid var(--border-color);
            border-radius: 12px;
            padding: 30px;
            margin-bottom: 40px;
            text-align: center;
        }

        .score-title {
            font-size: 1.6rem;
            font-weight: 700;
            margin-bottom: 10px;
        }

        .score-number {
            font-size: 2.5rem;
            font-weight: 800;
            color: var(--accent-color);
        }

        /* FEEDBACK E RESOLUÇÕES APÓS ENVIO */
        .resolution-box {
            display: none;
            margin-top: 20px;
            padding: 15px 20px;
            border-left: 4px solid #718096;
            background-color: #f8fafc;
            border-radius: 0 8px 8px 0;
            font-size: 1rem;
        }

        .resolution-title {
            font-weight: 700;
            margin-bottom: 5px;
            color: #4a5568;
        }

        /* Classes injetadas via JavaScript para correção */
        .correct-choice {
            border-color: var(--correct-color) !important;
            background-color: #f0fff4 !important;
            color: var(--correct-color);
            font-weight: 600;
        }

        .incorrect-choice {
            border-color: var(--incorrect-color) !important;
            background-color: #fff5f5 !important;
            color: var(--incorrect-color);
        }

        .disabled-option {
            pointer-events: none;
            opacity: 0.8;
        }

        footer {
            text-align: center;
            margin-top: 60px;
            color: var(--text-muted);
            font-size: 0.9rem;
            border-top: 1px solid var(--border-color);
            padding-top: 20px;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>Quiz: Ética, Sustentabilidade e TI Verde</h1>
        <p class="subtitle">Organização Estruturada de Computadores — Aula 5</p>
    </header>

    <form id="quiz-form">
        <div id="quiz-questions"></div>

        <div id="result-panel">
            <p class="score-title">Resultado do Quiz</p>
            <p class="score-number"><span id="score-hits">0</span> / 10</p>
            <p id="score-message" style="margin-top: 10px; font-weight: 500;"></p>
        </div>

        <div class="submit-section">
            <button type="button" id="btn-finish" class="btn-submit" onclick="gradeQuiz()">Finalizar Quiz</button>
        </div>
    </form>

    <footer>
        <p>IFPE Afogados da Ingazeira | Conteúdo Integrado da Aula 5</p>
    </footer>
</div>

<script>
    // Banco de dados contendo estritamente as informações e resoluções com base na aula
    const quizData = [
        {
            id: 1,
            question: "De acordo com o material da aula, o volume de descarte do lixo eletrônico no mundo apresenta qual ritmo de crescimento em comparação ao lixo comum?",
            options: [
                "Cresce no mesmo ritmo que o lixo comum.",
                "Cresce duas vezes mais rápido do que o lixo comum.",
                "Cresce três vezes mais rápido do que o lixo comum.",
                "Cresce quatro vezes mais rápido do que o lixo comum."
            ],
            correct: 2,
            resolution: "O material afirma explicitamente no cenário da crise global do lixo eletrônico que este volume de descarte cresce três vezes mais rápido do que o lixo comum (3X mais rápido)."
        },
        {
            id: 2,
            question: "Qual dos seguintes elementos químicos encontrados em computadores é classificado especificamente como 'carcinogênico' nos infográficos apresentados na aula?",
            options: [
                "Chumbo (Pb)",
                "Mercúrio (Hg)",
                "Cádmio (Cd)",
                "Arsênio (As)"
            ],
            correct: 2,
            resolution: "O infográfico detalha os perigos químicos identificando o Cádmio (Cd) diretamente com o rótulo de 'Carcinogênico'. O chumbo é associado a 'Tóxico' e o mercúrio a danos do tipo 'Neurológico'."
        },
        {
            id: 3,
            question: "Quando o lixo eletrônico é descartado incorretamente em lixões impróprios, qual é o caminho físico da contaminação que afeta diretamente as comunidades locais segundo o fluxo do impacto ambiental?",
            options: [
                "Os metais pesados evaporam na atmosfera e precipitam como chuva ácida diretamente nas cidades.",
                "Os metais penetram no solo, contaminam os lençóis freáticos e entram na cadeia alimentar através de plantas e animais.",
                "Os plásticos derretem com o sol e criam uma barreira impermeável que destrói as raízes das plantas.",
                "Os componentes eletrônicos sofrem combustão espontânea e geram gases que destroem a camada de ozônio."
            ],
            correct: 1,
            resolution: "O diagrama de impacto ambiental traça o caminho exato da contaminação: o lixo no lixão impróprio infiltra substâncias tóxicas nos lençóis freáticos, que contaminam o solo, as culturas agrícolas (plantas), o gado (animais) e por fim chegam aos seres humanos."
        },
        {
            id: 4,
            question: "O que define o conceito central de TI Verde (Green Computing) apresentado na aula?",
            options: [
                "É a substituição completa de computadores digitais por sistemas biológicos baseados em plantas.",
                "É um conjunto de práticas para fabricar, utilizar e descartar computadores e servidores de forma ecológica e eficiente.",
                "É o desenvolvimento de softwares voltados exclusivamente para o monitoramento do desmatamento de florestas.",
                "É a obrigatoriedade de pintar componentes de hardware com tintas ecológicas biodegradáveis de cor verde."
            ],
            correct: 1,
            resolution: "TI Verde (Green IT) é definida no texto como o conjunto de práticas e abordagens que visa reduzir o impacto ambiental da tecnologia da informação por meio da fabricação, uso e descarte ecológico e eficiente."
        },
        {
            id: 5,
            question: "Configurar o computador para entrar em modo de suspensão após 15 minutos ocioso é um exemplo prático de qual pilar da TI Verde?",
            options: [
                "TI Verde Tática",
                "TI Verde Estratégica",
                "TI Verde Profunda",
                "TI Verde Operacional"
            ],
            correct: 0,
            resolution: "A TI Verde Tática diz respeito ao 'Uso' — mudar hábitos simples do dia a dia para economizar energia, tendo como exemplo direto a configuração do modo de suspensão após 15 minutos ocioso."
        },
        {
            id: 6,
            question: "Como a TI Verde Estratégica atua na mudança da infraestrutura de Data Centers e grandes servidores para mitigar o gasto excessivo de eletricidade?",
            options: [
                "Desligando os servidores durante a noite e operando apenas em horário comercial.",
                "Projetando instalações que utilizam fontes renováveis (solar/eólica) e métodos de refrigeração natural (como água do mar ou vento gelado em regiões frias).",
                "Substituindo o armazenamento em nuvem por mídias físicas locais como disquetes e CDs recicláveis.",
                "Obrigando os usuários a reduzirem a qualidade de exibição de vídeos para preto e branco."
            ],
            correct: 1,
            resolution: "A TI Verde Estratégica atua na infraestrutura. O material demonstra o uso de fontes renováveis (solar, eólica) e refrigeração natural aproveitando o vento gelado de regiões frias (como a Islândia) ou o fundo do oceano com água do mar."
        },
        {
            id: 7,
            question: "Um usuário possui um smartphone que funciona perfeitamente bem por fora e não tem defeitos físicos, mas não consegue mais abrir o aplicativo do WhatsApp porque o sistema operacional parou de receber atualizações. Esse cenário descreve qual tipo de obsolescência programada?",
            options: [
                "Obsolescência Econômica ou Funcional",
                "Obsolescência Sistêmica ou De Software",
                "Obsolescência Perceptiva ou Psicológica",
                "Obsolescência Programada Estratégica"
            ],
            correct: 1,
            resolution: "A obsolescência Sistêmica ou de Software ocorre especificamente quando o aparelho ainda funciona por fora, mas o sistema operacional (Android/iOS) deixa de atualizar e os aplicativos param de abrir."
        },
        {
            id: 8,
            question: "A obsolescência perceptiva (ou psicológica) atinge o consumidor de que maneira, segundo as definições da aula?",
            options: [
                "Fazendo o dispositivo emitir um sinal sonoro irritante que força o usuário a jogá-lo fora.",
                "Bloqueando a tela do usuário com mensagens de cobrança para novas atualizações pagas.",
                "Utilizando o marketing para lançar novas cores ou designs sutis, criando no usuário o sentimento de obsolescência e vergonha de portar o modelo anterior.",
                "Impedindo o carregamento completo da bateria por meio de travas psicológicas embutidas no circuito interno."
            ],
            correct: 2,
            resolution: "Na obsolescência perceptiva, o aparelho funciona e está atualizado, mas o apelo de marketing foca em lançar mudanças estéticas (como novas cores), fazendo o usuário sentir vergonha de portar um modelo tido como 'velho'."
        },
        {
            id: 9,
            question: "No contexto da ética na TI, qual a distinção prática apresentada entre 'Moral' e 'Ética'?",
            options: [
                "A moral é individual e imutável, enquanto a ética representa as leis sancionadas pelo governo de um país.",
                "A moral trata das regras de conduta assimiladas do grupo (família, sociedade, religião), enquanto a ética é o pensamento crítico e a reflexão pessoal sobre a justiça dessas regras.",
                "A moral aplica-se apenas às relações pessoais físicas, ao passo que a ética é um termo exclusivo para o desenvolvimento de códigos de programação computacional.",
                "Não há nenhuma distinção conceitual no material; ambos os termos são tratados estritamente como sinônimos perfeitos."
            ],
            correct: 1,
            resolution: "Conforme os slides, Moral representa as 'regras do grupo' assimiladas na sociedade, enquanto a Ética constitui a 'reflexão pessoal' — o pensamento crítico para avaliar se as regras fazem sentido e são justas."
        },
        {
            id: 10,
            question: "Quais são os três deveres fundamentais estabelecidos nos manuais rígidos de códigos de ética profissional de associações como a ACM e a SBC?",
            options: [
                "Maximizar o lucro das corporações, acelerar o ciclo de troca de hardware e coletar o máximo de dados possível.",
                "Evitar Danos (não poluir ou destruir empregos irresponsavelmente), Ser Transparente (rejeitar obsolescência escondida) e Promover a Inclusão (tecnologias acessíveis).",
                "Reduzir o custo de fabricação com componentes econômicos, ignorar licenças de software e focar no design visual.",
                "Automatizar todos os postos de trabalho existentes, ocultar processos algorítmicos complexos e restringir o uso da internet."
            ],
            correct: 1,
            resolution: "Os códigos profissionais da ACM e da SBC impõem explicitamente três pilares éticos descritos na aula: Evitar Danos (recusar poluição/desemprego irresponsável), Ser Transparente (rejeitar obsolescência escondida) e Promover a Inclusão (combater a desigualdade social com acessibilidade)."
        }
    ];

    // Renderizar as questões dinamicamente ao carregar a página
    function renderQuiz() {
        const container = document.getElementById('quiz-questions');
        container.innerHTML = quizData.map((q, qIndex) => `
            <div class="quiz-card" id="card-${qIndex}">
                <div class="question-number">Questão ${qIndex + 1} de ${quizData.length}</div>
                <div class="question-text">${q.question}</div>
                <div class="options-container">
                    ${q.options.map((opt, oIndex) => `
                        <label class="option-label" id="label-${qIndex}-${oIndex}">
                            <input type="radio" name="question-${qIndex}" value="${oIndex}">
                            <span>${opt}</span>
                        </label>
                    `).join('')}
                </div>
                <div class="resolution-box" id="res-${qIndex}">
                    <div class="resolution-title">Resolução Comentada:</div>
                    <div>${q.resolution}</div>
                </div>
            </div>
        `).join('');
    }

    // Processar e corrigir o quiz demonstrando os resultados em tempo real
    function gradeQuiz() {
        let hits = 0;
        let allAnswered = true;

        // Verificar se todas as questões foram marcadas antes de submeter
        quizData.forEach((q, qIndex) => {
            const selected = document.querySelector(`input[name="question-${qIndex}"]:checked`);
            if (!selected) {
                allAnswered = false;
            }
        });

        if (!allAnswered) {
            alert("Por favor, responda a todas as 10 questões antes de finalizar o quiz.");
            return;
        }

        // Aplicar a correção visual e expor as resoluções
        quizData.forEach((q, qIndex) => {
            const selected = document.querySelector(`input[name="question-${qIndex}"]:checked`);
            const selectedValue = parseInt(selected.value);
            const correctValue = q.correct;

            // Bloquear novos inputs
            const options = document.querySelectorAll(`input[name="question-${qIndex}"]`);
            options.forEach(opt => opt.disabled = true);

            const labels = document.querySelectorAll(`[id^="label-${qIndex}-"]`);
            labels.forEach(label => label.classList.add('disabled-option'));

            // Marcar acertos e erros nas bordas/fundos das opções
            if (selectedValue === correctValue) {
                hits++;
                document.getElementById(`label-${qIndex}-${correctValue}`).classList.add('correct-choice');
            } else {
                document.getElementById(`label-${qIndex}-${selectedValue}`).classList.add('incorrect-choice');
                document.getElementById(`label-${qIndex}-${correctValue}`).classList.add('correct-choice');
            }

            // Exibir a caixa de resolução logo abaixo da respectiva questão
            document.getElementById(`res-${qIndex}`).style.display = 'block';
        });

        // Configurar painel de pontuação final
        document.getElementById('score-hits').innerText = hits;
        const panel = document.getElementById('result-panel');
        panel.style.display = 'block';

        const msgElement = document.getElementById('score-message');
        if (hits >= 7) {
            msgElement.innerHTML = "Excelente desempenho! Você assimilou muito bem os conceitos de TI Verde e Ética.";
            msgElement.style.color = "var(--correct-color)";
        } else {
            msgElement.innerHTML = "Bom esforço! Revise as resoluções comentadas abaixo para consolidar o aprendizado.";
            msgElement.style.color = "#b7791f";
        }

        // Rolar suavemente até o placar
        panel.scrollIntoView({ behavior: 'smooth' });

        // Ocultar o botão para evitar reenvios desnecessários
        document.getElementById('btn-finish').style.display = 'none';
    }

    // Inicialização da página
    window.onload = renderQuiz;
</script>

</body>
</html>
