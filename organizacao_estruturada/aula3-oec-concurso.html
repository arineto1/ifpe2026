<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulado: Arquitetura de Memória e Sistemas Computacionais</title>
    <style>
        :root {
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --text-muted: #475569;
            --accent: #2563eb;
            --accent-hover: #1d4ed8;
            --success: #16a34a;
            --error: #dc2626;
            --border: #e2e8f0;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            line-height: 1.6;
            padding: 2rem 1rem;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 3rem;
            border-bottom: 2px solid var(--border);
            padding-bottom: 1.5rem;
        }

        h1 {
            font-size: 1.8rem;
            color: var(--text-main);
            margin-bottom: 0.5rem;
        }

        .subtitle {
            color: var(--text-muted);
            font-size: 1.1rem;
        }

        .quiz-card {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 2rem;
            margin-bottom: 2rem;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            border: 1px solid var(--border);
        }

        .question-header {
            font-weight: bold;
            font-size: 1.1rem;
            margin-bottom: 1rem;
            display: flex;
            align-items: flex-start;
        }

        .question-number {
            background: var(--accent);
            color: white;
            padding: 2px 8px;
            border-radius: 4px;
            margin-right: 12px;
            font-size: 0.9rem;
        }

        .options-list {
            list-style: none;
            margin-top: 1rem;
        }

        .option-item {
            margin-bottom: 0.75rem;
            padding: 0.75rem 1rem;
            border: 1px solid var(--border);
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
        }

        .option-item:hover {
            background-color: #f1f5f9;
            border-color: var(--accent);
        }

        .option-item input {
            margin-right: 12px;
            width: 18px;
            height: 18px;
            cursor: pointer;
        }

        .option-item.selected {
            background-color: #eff6ff;
            border-color: var(--accent);
            font-weight: 500;
        }

        /* Classes para o resultado final */
        .option-item.correct {
            background-color: #dcfce7;
            border-color: var(--success);
            color: var(--success);
        }

        .option-item.wrong {
            background-color: #fee2e2;
            border-color: var(--error);
            color: var(--error);
        }

        .resolution {
            margin-top: 1.5rem;
            padding: 1rem;
            background-color: #f1f5f9;
            border-left: 4px solid var(--accent);
            border-radius: 4px;
            display: none; /* Escondido inicialmente */
        }

        .resolution h4 {
            margin-bottom: 0.5rem;
            color: var(--accent);
        }

        .submit-container {
            text-align: center;
            margin-top: 2rem;
        }

        .btn-submit {
            background-color: var(--accent);
            color: white;
            padding: 1rem 2.5rem;
            border: none;
            border-radius: 8px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn-submit:hover {
            background-color: var(--accent-hover);
        }

        #result-summary {
            display: none;
            text-align: center;
            background: #fff;
            padding: 2rem;
            border-radius: 12px;
            margin-bottom: 2rem;
            border: 2px solid var(--accent);
        }

        .score-text {
            font-size: 1.5rem;
            font-weight: bold;
            margin-bottom: 0.5rem;
        }

        @media (max-width: 600px) {
            body { padding: 1rem 0.5rem; }
            .quiz-card { padding: 1.5rem 1rem; }
            h1 { font-size: 1.5rem; }
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>Simulado: Arquitetura e Gerenciamento de Memória</h1>
            <p class="subtitle">Estilo Concurso Professor EBTT - Institutos Federais</p>
        </header>

        <div id="result-summary">
            <p class="score-text" id="score-display"></p>
            <p id="feedback-text"></p>
        </div>

        <form id="quiz-form">
            <div id="questions-container"></div>
            
            <div class="submit-container">
                <button type="button" class="btn-submit" id="finish-btn">Finalizar e Ver Resoluções</button>
            </div>
        </form>
    </div>

    <script>
        const questions = [
            {
                id: 1,
                text: "A memória DRAM (Dynamic Random Access Memory) é o padrão utilizado para a memória principal de computadores pessoais. Sobre a estrutura física e o funcionamento básico da célula de memória DRAM, assinale a alternativa correta:",
                options: [
                    "Cada bit é armazenado em um flip-flop composto por seis transistores, o que elimina a necessidade de recarga elétrica.",
                    "A célula de memória utiliza um transistor e um capacitor, onde o capacitor armazena a carga elétrica que representa o bit.",
                    "A natureza estática da DRAM permite que ela mantenha os dados permanentemente, mesmo sem alimentação elétrica.",
                    "O processo de refresh é exclusivo da memória cache e serve para sincronizar o clock do processador com a memória RAM."
                ],
                correct: 1,
                resolution: "A tecnologia DRAM baseia-se na simplicidade da célula 1T1C (um transistor e um capacitor). O capacitor armazena o bit como carga elétrica, enquanto o transistor funciona como o interruptor que permite a leitura ou gravação dessa carga. A alternativa A descreve a SRAM; a C é incorreta porque a DRAM é volátil; a D é incorreta porque o refresh é interno à memória principal."
            },
            {
                id: 2,
                text: "A memória principal do tipo dinâmica exige um ciclo periódico de refresh para garantir a integridade dos dados. Qual o fenômeno físico que justifica a necessidade desse processo e qual o impacto aproximado no sistema?",
                options: [
                    "Efeito Joule; o calor faz com que os dados mudem de polaridade a cada 100ms.",
                    "Vazamento de carga (leaking); o capacitor perde carga naturalmente, exigindo recarga a cada 64ms.",
                    "Indução eletromagnética; os pinos de contato do módulo DIMM perdem condutividade se não houver pulso de energia constante.",
                    "Fragmentação externa; o controlador de memória precisa reorganizar os bits na RAM para evitar o travamento do sistema."
                ],
                correct: 1,
                resolution: "O capacitor da DRAM não é um isolante perfeito, ocorrendo o vazamento (leaking) da carga elétrica. Para evitar a perda do bit, o controlador de memória realiza a leitura e reescrita de todas as células em intervalos cíclicos, tipicamente a cada 64ms."
            },
            {
                id: 3,
                text: "O padrão DDR5 introduziu mudanças significativas na arquitetura dos módulos de memória em relação às gerações anteriores (DDR3 e DDR4). De acordo com as tendências de evolução tecnológica, uma característica exclusiva do DDR5 é:",
                options: [
                    "O aumento da voltagem de operação para 3.3V visando maior velocidade de transferência.",
                    "A integração do PMIC (Circuito Integrado de Gerenciamento de Energia) diretamente no módulo DIMM.",
                    "A redução do número de pinos de contato para 168, facilitando a miniaturização dos dispositivos.",
                    "A transição da tecnologia de capacitores para armazenamento magnético, tornando a RAM não-volátil."
                ],
                correct: 1,
                resolution: "O DDR5 deslocou a regulação de voltagem da placa-mãe diretamente para o módulo de memória através do PMIC. Isso permite um controle de energia mais estável e eficiente, reduzindo a tensão operacional para 1.1V."
            },
            {
                id: 4,
                text: "A organização da memória em um sistema computacional é estruturada de forma hierárquica para otimizar o desempenho. Ao analisar a pirâmide de memória, partindo do topo (registradores) para a base (armazenamento secundário), observa-se que:",
                options: [
                    "O custo por byte aumenta e a capacidade de armazenamento também aumenta.",
                    "A velocidade de acesso diminui (latência aumenta) e o custo por byte diminui.",
                    "A capacidade de armazenamento diminui e a volatilidade dos dados deixa de existir.",
                    "O tempo de acesso melhora (diminui) e a densidade de armazenamento aumenta significativamente."
                ],
                correct: 1,
                resolution: "A pirâmide de memória estabelece que quanto mais próximo da CPU, mais rápido (menor latência) e caro é o componente. Consequentemente, ao descer a pirâmide, a velocidade diminui e o custo por byte cai significativamente."
            },
            {
                id: 5,
                text: "A memória virtual é um mecanismo que permite ao sistema operacional gerenciar o espaço de endereçamento de forma eficiente. Segundo Stallings, uma das principais funções da memória virtual é:",
                options: [
                    "Aumentar a frequência de clock do processador através do uso de espaço em disco como cache L4.",
                    "Permitir que o armazenamento secundário seja tratado como se fosse parte da memória principal, possibilitando a execução de programas maiores que a RAM física.",
                    "Eliminar a necessidade de memória RAM física, utilizando apenas SSDs NVMe para todas as tarefas de processamento.",
                    "Garantir que todos os dados de um processo sejam mantidos permanentemente nos registradores da CPU para evitar latência."
                ],
                correct: 1,
                resolution: "Stallings define a memória virtual como um esquema que permite ao sistema tratar o armazenamento secundário como parte da RAM, criando um espaço de endereçamento lógico que supera as limitações físicas do hardware instalado."
            },
            {
                id: 6,
                text: "No sistema de paginação, o espaço de endereçamento virtual e o físico são divididos em unidades de tamanho fixo. Assinale a alternativa que define corretamente esses termos:",
                options: [
                    "Páginas são blocos na RAM física; Molduras (frames) são blocos no espaço virtual.",
                    "Páginas são blocos no espaço virtual; Molduras (frames) são blocos na RAM física.",
                    "Segmentos são blocos no disco; Páginas são blocos exclusivos do cache L2.",
                    "Molduras são blocos de 1GB localizados nos registradores; Páginas são blocos de 4KB no BIOS."
                ],
                correct: 1,
                resolution: "Na paginação, as unidades do espaço de endereçamento virtual são as 'Páginas', enquanto as unidades físicas na memória RAM onde essas páginas são carregadas são as 'Molduras' (frames)."
            },
            {
                id: 7,
                text: "O evento de Page Fault (Falta de Página) é uma parte integrante do funcionamento da memória virtual. Sobre este evento, é correto afirmar que:",
                options: [
                    "Ocorre sempre que o processador encontra um erro crítico de divisão por zero.",
                    "É uma falha catastrófica de hardware que indica que o módulo de memória RAM está queimado.",
                    "Ocorre quando um programa tenta acessar uma página que não está atualmente carregada na memória RAM física.",
                    "Trata-se de um erro de software que impede o sistema operacional de reconhecer o disco rígido."
                ],
                correct: 2,
                resolution: "O Page Fault não é um erro fatal, mas um evento normal de controle. Ele sinaliza ao sistema operacional que o programa referenciou uma página que ainda não foi trazida do disco para a RAM."
            },
            {
                id: 8,
                text: "Um sistema computacional entra em estado de Thrashing quando o gerenciamento de memória virtual entra em colapso. Este fenômeno é caracterizado por:",
                options: [
                    "O processador atingir baixas temperaturas devido à falta de tarefas de cálculo complexo.",
                    "O sistema operacional gastar a maior parte do tempo trocando páginas entre a RAM e o disco, resultando em lentidão extrema.",
                    "Um aumento súbito na velocidade de navegação na internet devido ao esvaziamento do cache do navegador.",
                    "A exclusão automática de arquivos do usuário para liberar espaço na memória cache L1 da CPU."
                ],
                correct: 1,
                resolution: "O Thrashing é o estado patológico onde a frequência de faltas de página é tão alta que o sistema gasta todo o seu tempo de processamento movendo dados entre o disco e a RAM, anulando a produtividade da CPU."
            },
            {
                id: 9,
                text: "Um administrador de sistemas observa que um computador apresenta uso de CPU próximo a 5%, enquanto o uso do disco está em 100% e a memória RAM física está completamente ocupada. Qual é o diagnóstico mais provável e a solução recomendada?",
                options: [
                    "Diagnóstico: O processador está com defeito; Solução: Trocar a CPU por uma de maior frequência.",
                    "Diagnóstico: O sistema está em thrashing; Solução: Instalar mais memória RAM física.",
                    "Diagnóstico: O SSD está muito rápido para a placa-mãe; Solução: Trocar o SSD por um HD mecânico.",
                    "Diagnóstico: Falta de arquivos de log; Solução: Deletar a partição de swap do sistema."
                ],
                correct: 1,
                resolution: "O sintoma descrito (RAM cheia, disco a 100% e CPU ociosa) é o diagnóstico clássico de thrashing. A única solução eficaz é aumentar a memória física para comportar o 'working set' dos processos."
            },
            {
                id: 10,
                text: "No ensino de Arquitetura de Computadores, a analogia da 'Mesa de Estudo' e da 'Estante de Livros' é frequentemente utilizada para explicar o funcionamento da hierarquia de memória. Nesta analogia:",
                options: [
                    "A Mesa representa o cache L1 e a Estante representa os registradores.",
                    "A Mesa representa a memória RAM e a Estante representa o armazenamento secundário (HD/SSD).",
                    "Os livros representam o cooler e a mesa representa a fonte de alimentação (PSU).",
                    "O tamanho da mesa representa a largura do barramento de controle e a estante o barramento de endereços."
                ],
                correct: 1,
                resolution: "Pedagogicamente, a mesa representa o espaço de trabalho imediato e rápido (RAM), enquanto a estante representa o acervo vasto e lento (armazenamento secundário)."
            }
        ];

        const container = document.getElementById('questions-container');

        // Gerar as questões dinamicamente
        questions.forEach((q, index) => {
            const card = document.createElement('div');
            card.className = 'quiz-card';
            card.id = `q-card-${index}`;

            const labels = ['A', 'B', 'C', 'D'];
            const optionsHtml = q.options.map((opt, i) => `
                <label class="option-item" for="q${index}o${i}">
                    <input type="radio" name="question${index}" id="q${index}o${i}" value="${i}">
                    <span><strong>${labels[i]})</strong> ${opt}</span>
                </label>
            `).join('');

            card.innerHTML = `
                <div class="question-header">
                    <span class="question-number">${q.id}</span>
                    <span>${q.text}</span>
                </div>
                <div class="options-list">
                    ${optionsHtml}
                </div>
                <div class="resolution" id="res-${index}">
                    <h4>Resolução Comentada:</h4>
                    <p>${q.resolution}</p>
                </div>
            `;
            container.appendChild(card);
        });

        // Adicionar comportamento visual de seleção
        document.querySelectorAll('.option-item').forEach(item => {
            item.addEventListener('click', function() {
                const name = this.querySelector('input').name;
                document.querySelectorAll(`input[name="${name}"]`).forEach(input => {
                    input.parentElement.classList.remove('selected');
                });
                this.classList.add('selected');
            });
        });

        // Lógica de finalização
        document.getElementById('finish-btn').addEventListener('click', () => {
            let score = 0;
            const form = document.getElementById('quiz-form');
            const data = new FormData(form);

            questions.forEach((q, index) => {
                const userAnswer = data.get(`question${index}`);
                const card = document.getElementById(`q-card-${index}`);
                const resolutionDiv = document.getElementById(`res-${index}`);
                const options = card.querySelectorAll('.option-item');

                // Mostrar resolução
                resolutionDiv.style.display = 'block';

                // Marcar correta e errada
                options.forEach((opt, i) => {
                    opt.classList.remove('selected');
                    if (i == q.correct) {
                        opt.classList.add('correct');
                    }
                    if (userAnswer != null && userAnswer == i && i != q.correct) {
                        opt.classList.add('wrong');
                    }
                });

                if (userAnswer != null && userAnswer == q.correct) {
                    score++;
                }
            });

            // Mostrar resumo
            const summary = document.getElementById('result-summary');
            const scoreDisplay = document.getElementById('score-display');
            const feedback = document.getElementById('feedback-text');
            
            summary.style.display = 'block';
            scoreDisplay.innerText = `Você acertou ${score} de ${questions.length} questões!`;
            
            if (score >= 8) {
                feedback.innerText = "Excelente desempenho! Você domina os conceitos de arquitetura de memória.";
                feedback.style.color = "var(--success)";
            } else if (score >= 5) {
                feedback.innerText = "Bom desempenho. Revise os pontos das resoluções comentadas para fixar o conteúdo.";
                feedback.style.color = "var(--text-main)";
            } else {
                feedback.innerText = "Recomendamos uma nova leitura da aula 31 para reforçar as bases técnicas.";
                feedback.style.color = "var(--error)";
            }

            // Scroll para o topo para ver o resultado
            window.scrollTo({ top: 0, behavior: 'smooth' });

            // Desabilitar o botão e inputs após finalizar
            document.getElementById('finish-btn').disabled = true;
            document.getElementById('finish-btn').style.opacity = "0.5";
            document.getElementById('finish-btn').innerText = "Simulado Finalizado";
            document.querySelectorAll('input[type="radio"]').forEach(input => input.disabled = true);
        });
    </script>
</body>
</html>
