<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulado EBTT - Autômatos Finitos</title>
    <style>
        :root {
            --bg-color: #fdfdfd;
            --container-bg: #ffffff;
            --text-primary: #2c3e50;
            --text-secondary: #576574;
            --accent-color: #3498db;
            --correct-color: #27ae60;
            --incorrect-color: #e74c3c;
            --border-color: #ecf0f1;
            --resolution-bg: #f8f9fa;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            line-height: 1.6;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            max-width: 850px;
            width: 100%;
            background: var(--container-bg);
            padding: 40px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }

        header {
            border-bottom: 2px solid var(--border-color);
            margin-bottom: 30px;
            padding-bottom: 20px;
        }

        h1 {
            font-size: 1.8rem;
            color: var(--text-primary);
            margin-bottom: 10px;
        }

        .intro {
            color: var(--text-secondary);
            font-size: 1.1rem;
        }

        .question-card {
            margin-bottom: 40px;
            padding-bottom: 30px;
            border-bottom: 1px solid var(--border-color);
        }

        .question-title {
            font-weight: 600;
            font-size: 1.15rem;
            margin-bottom: 15px;
            display: block;
        }

        .options-list {
            list-style: none;
            padding: 0;
        }

        .option-item {
            margin-bottom: 12px;
            padding: 12px 15px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
        }

        .option-item:hover {
            background-color: #f1f8ff;
            border-color: var(--accent-color);
        }

        .option-item input {
            margin-right: 15px;
            cursor: pointer;
        }

        .option-item.selected {
            background-color: #ebf5ff;
            border-color: var(--accent-color);
        }

        .option-item.correct {
            background-color: #d4edda;
            border-color: var(--correct-color);
            color: #155724;
        }

        .option-item.incorrect {
            background-color: #f8d7da;
            border-color: var(--incorrect-color);
            color: #721c24;
        }

        .btn-submit {
            background-color: var(--accent-color);
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            width: 100%;
            transition: background 0.3s;
        }

        .btn-submit:hover {
            background-color: #2980b9;
        }

        .results-section {
            display: none;
            margin-top: 30px;
            padding: 25px;
            border-radius: 8px;
            text-align: center;
            background-color: var(--resolution-bg);
            border: 2px solid var(--accent-color);
        }

        .score-display {
            font-size: 1.5rem;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .resolution {
            display: none;
            margin-top: 15px;
            padding: 15px;
            background-color: var(--resolution-bg);
            border-left: 4px solid var(--accent-color);
            font-size: 0.95rem;
            color: var(--text-secondary);
        }

        .show-resolution .resolution {
            display: block;
        }

        footer {
            margin-top: 50px;
            text-align: center;
            color: #95a5a6;
            font-size: 0.8rem;
        }

        @media (max-width: 600px) {
            .container {
                padding: 20px;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>Simulado: Autômatos Finitos</h1>
        <p class="intro">Prepare-se para o concurso de Professor EBTT com estas 10 questões fundamentais sobre Teoria da Computação.</p>
    </header>

    <form id="quiz-form">
        <div id="questions-container">
            <!-- As questões serão inseridas aqui via JavaScript -->
        </div>

        <button type="button" id="submit-btn" class="btn-submit">Finalizar Quiz e Ver Resoluções</button>
    </form>

    <div id="results-area" class="results-section">
        <div class="score-display" id="score-text"></div>
        <p>As resoluções detalhadas foram desbloqueadas abaixo de cada questão.</p>
    </div>

    <footer>
        Desenvolvido para fins didáticos - Estilo Concurso Instituto Federal
    </footer>
</div>

<script>
    const questionsData = [
        {
            id: 1,
            text: "A teoria dos autômatos é fundamental para o estudo de modelos abstratos de computação. No que diz respeito aos Autômatos Finitos Determinísticos (AFD), é uma condição OBRIGATÓRIA para a sua definição formal que:",
            options: [
                "Exista pelo menos uma transição vazia (ε) para garantir a flexibilidade do processamento.",
                "Para cada estado e para cada símbolo do alfabeto, exista exatamente uma transição de saída definida.",
                "O autômato possua memória auxiliar ilimitada para o processamento de cadeias recursivas.",
                "O número de estados iniciais seja igual ao número de símbolos do alfabeto Σ."
            ],
            correct: 1,
            resolution: "O AFD é regido pelo princípio da unicidade e da totalidade. A função de transição δ: Q × Σ → Q exige que para cada par (estado, símbolo) haja um único estado de destino. Isso elimina a ambiguidade e garante a previsibilidade do modelo."
        },
        {
            id: 2,
            text: "No contexto dos Autômatos Finitos Não-Determinísticos (AFN), o processamento de uma cadeia de entrada pode gerar múltiplas ramificações. Segundo o critério de aceitação padrão para este modelo, uma cadeia w é considerada ACEITA pelo AFN se:",
            options: [
                "Todas as ramificações geradas pela leitura da cadeia w terminarem em um estado de aceitação.",
                "Pelo menos uma ramificação da computação terminar em um estado de aceitação após a leitura completa de w.",
                "O número de ramificações que atingem estados finais for maior que o número de ramificações que 'morrem' por falta de transição.",
                "A máquina realizar pelo menos uma transição vazia (ε) durante o processamento da cadeia."
            ],
            correct: 1,
            resolution: "No AFN basta que um único 'explorador' da árvore de computação chegue ao estado de aceitação após consumir toda a entrada para que a palavra inteira seja validada. O não-determinismo investiga todos os caminhos possíveis simultaneamente."
        },
        {
            id: 3,
            text: "Transições vazias, denotadas por epsilon (ε), são recursos que permitem ao autômato mudar de estado sem consumir nenhum símbolo da entrada. Sobre o impacto do uso de ε no poder de reconhecimento de um autômato finito, assinale a alternativa correta:",
            options: [
                "Aumenta o poder de reconhecimento da máquina, permitindo que ela reconheça linguagens livres de contexto.",
                "Torna a máquina mais lenta, porém capaz de reconhecer linguagens sensíveis ao contexto.",
                "Não altera o poder de reconhecimento da máquina, que continua restrita às linguagens regulares.",
                "Permite que o autômato funcione com um alfabeto infinito de símbolos."
            ],
            correct: 2,
            resolution: "Um dos teoremas fundamentais afirma que AFDs, AFNs e AFNs-ε são todos equivalentes em poder de expressão. Todos reconhecem as linguagens regulares. O ε é apenas uma facilidade de modelagem."
        },
        {
            id: 4,
            text: "O algoritmo de Construção de Subconjuntos é utilizado para converter um AFN em um AFD equivalente. Se um AFN possui um conjunto de estados Q com n elementos, qual é o número máximo teórico de estados que o AFD correspondente pode vir a ter?",
            options: [
                "n²",
                "2n",
                "2ⁿ",
                "n! (fatorial de n)"
            ],
            correct: 2,
            resolution: "Cada estado do novo AFD representa uma combinação possível de estados onde o AFN original poderia estar. Matematicamente, isso é o Conjunto das Partes, cujo tamanho é 2ⁿ para um conjunto de n elementos."
        },
        {
            id: 5,
            text: "Ao analisar visualmente um diagrama de estados de um autômato, como um professor EBTT pode identificar que se trata de um Autômato Finito Determinístico (AFD) e não de um AFN?",
            options: [
                "Pela presença de transições rotuladas com o símbolo ε.",
                "Pela existência de estados que possuem mais de uma seta de saída com o mesmo rótulo.",
                "Pela ausência de transições vazias e pelo fato de que cada estado possui exatamente uma transição de saída para cada símbolo do alfabeto.",
                "Pela presença de múltiplos círculos com contorno duplo, indicando vários estados iniciais."
            ],
            correct: 2,
            resolution: "O AFD é um grafo onde o grau de saída de cada nó para cada símbolo do alfabeto é exatamente 1. Não há ambiguidade (mesmo rótulo saindo para lugares diferentes) nem movimentos espontâneos (ε)."
        },
        {
            id: 6,
            text: "Um autômato finito é definido pela quíntupla (Q, Σ, δ, q₀, F). Em um cenário onde a função de transição é definida como δ(q, a) = ∅ (conjunto vazio) para um determinado estado q e símbolo a, pode-se afirmar que:",
            options: [
                "O autômato é obrigatoriamente um AFD.",
                "O autômato é um AFN, e esse ramo da computação 'morre' ao tentar ler o símbolo 'a' no estado q.",
                "O autômato entrará em um laço infinito ao encontrar o símbolo 'a'.",
                "A cadeia de entrada será aceita automaticamente, independentemente do estado ser final ou não."
            ],
            correct: 1,
            resolution: "No AFN, a ausência de uma transição (conjunto vazio) leva ao descarte daquele ramo específico. No AFD, a função deve ser total, logo isso não ocorreria sem um estado de erro explícito."
        },
        {
            id: 7,
            text: "Qual é a principal vantagem de se utilizar um AFN durante a fase de design, sabendo que ele será posteriormente convertido em um AFD para implementação?",
            options: [
                "O AFN consome menos energia elétrica quando implementado diretamente em silício.",
                "O AFN permite descrever padrões complexos de forma mais intuitiva e compacta, facilitando o trabalho do designer humano e reduzindo erros de lógica.",
                "O AFN garante que o AFD final terá o menor número possível de estados sem necessidade de algoritmos de minimização.",
                "O AFN ignora as regras do alfabeto, permitindo o reconhecimento de símbolos desconhecidos."
            ],
            correct: 1,
            resolution: "O AFN permite focar no 'o que' reconhecer (o padrão), enquanto o AFD exige lidar com 'como' tratar todas as exceções e erros em cada estado. O AFN é muito mais próximo do raciocínio humano."
        },
        {
            id: 8,
            text: "Sobre as Linguagens Regulares, classe de linguagens reconhecida pelos Autômatos Finitos, assinale a afirmação correta:",
            options: [
                "Elas podem reconhecer o balanceamento de parênteses em expressões matemáticas de profundidade arbitrária.",
                "Elas são a classe mais alta na Hierarquia de Chomsky, contendo todas as linguagens possíveis.",
                "Elas podem ser descritas alternativamente por Expressões Regulares e Gramáticas Regulares.",
                "Elas exigem obrigatoriamente um autômato de pilha para serem processadas."
            ],
            correct: 2,
            resolution: "As Linguagens Regulares (Nível 3) possuem múltiplas representações equivalentes: AFDs, AFNs, Expressões Regulares e Gramáticas Regulares. Parênteses balanceados exigem Autômatos de Pilha (Linguagens Livres de Contexto)."
        },
        {
            id: 9,
            text: "No fluxo de trabalho prático que vai de uma Expressão Regular até o código de execução, qual é o papel desempenhado pelo AFD (Autômato Finito Determinístico)?",
            options: [
                "Atuar como um esboço inicial e intuitivo para o programador.",
                "Permitir que o sistema realize 'apostas' lógicas sobre o sufixo da cadeia.",
                "Prover uma estrutura puramente mecânica e sem ambiguidades que pode ser traduzida eficientemente em uma matriz de transição no código.",
                "Substituir a necessidade de uma Expressão Regular, tornando o código mais legível para humanos."
            ],
            correct: 2,
            resolution: "O AFD é a 'máquina' final. Sua ausência de ambiguidade permite que o processador execute saltos de estado em tempo constante usando matrizes de adjacência ou switch-cases otimizados."
        },
        {
            id: 10,
            text: "O que acontece quando um Autômato Finito Não-Determinístico (AFN) encontra um símbolo de entrada para o qual existem duas ou mais transições definidas a partir do estado atual?",
            options: [
                "O autômato trava e emite um erro de execução.",
                "O autômato escolhe aleatoriamente uma das transições e descarta as outras.",
                "O autômato se 'clona' ou se ramifica em múltiplas instâncias, explorando todos os caminhos em paralelo.",
                "O autômato ignora o símbolo e permanece no estado atual até encontrar um símbolo unívoco."
            ],
            correct: 2,
            resolution: "Esta é a definição de não-determinismo: a capacidade de investigar múltiplas ramificações. Se qualquer um desses 'clones' atingir um estado final ao fim da fita, a palavra é aceita."
        }
    ];

    const questionsContainer = document.getElementById('questions-container');
    const submitBtn = document.getElementById('submit-btn');
    const resultsArea = document.getElementById('results-area');
    const scoreText = document.getElementById('score-text');

    // Renderizar questões
    questionsData.forEach((q, index) => {
        const card = document.createElement('div');
        card.className = 'question-card';
        card.id = `q-card-${index}`;
        
        const title = document.createElement('span');
        title.className = 'question-title';
        title.innerText = `${index + 1}. ${q.text}`;
        card.appendChild(title);

        const optionsList = document.createElement('div');
        optionsList.className = 'options-list';

        q.options.forEach((opt, optIndex) => {
            const label = document.createElement('label');
            label.className = 'option-item';
            label.innerHTML = `
                <input type="radio" name="q${index}" value="${optIndex}">
                <span>${opt}</span>
            `;
            
            label.addEventListener('click', () => {
                if(!submitBtn.disabled) {
                    const siblings = optionsList.querySelectorAll('.option-item');
                    siblings.forEach(s => s.classList.remove('selected'));
                    label.classList.add('selected');
                }
            });

            optionsList.appendChild(label);
        });

        card.appendChild(optionsList);

        const resolutionDiv = document.createElement('div');
        resolutionDiv.className = 'resolution';
        resolutionDiv.innerHTML = `<strong>Resolução Comentada:</strong><br>${q.resolution}`;
        card.appendChild(resolutionDiv);

        questionsContainer.appendChild(card);
    });

    // Lógica do Submit
    submitBtn.addEventListener('click', () => {
        let score = 0;
        const total = questionsData.length;

        questionsData.forEach((q, index) => {
            const selectedInput = document.querySelector(`input[name="q${index}"]:checked`);
            const card = document.getElementById(`q-card-${index}`);
            const options = card.querySelectorAll('.option-item');
            
            card.classList.add('show-resolution');

            if (selectedInput) {
                const answer = parseInt(selectedInput.value);
                if (answer === q.correct) {
                    score++;
                    options[answer].classList.add('correct');
                } else {
                    options[answer].classList.add('incorrect');
                    options[q.correct].classList.add('correct');
                }
            } else {
                // Se não respondeu, apenas mostra a correta
                options[q.correct].classList.add('correct');
            }
        });

        // Mostrar resultados
        scoreText.innerText = `Você acertou ${score} de ${total} questões! (${(score/total*100).toFixed(0)}%)`;
        resultsArea.style.display = 'block';
        submitBtn.disabled = true;
        submitBtn.innerText = "Simulado Concluído";
        submitBtn.style.backgroundColor = "#95a5a6";
        submitBtn.style.cursor = "default";

        // Scroll suave para o resultado
        resultsArea.scrollIntoView({ behavior: 'smooth' });
    });

</script>

</body>
</html>
