<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menu de Disciplinas</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f3f4f6; /* gray-100 */
        }
        
        /* Custom scrollbar for webkit */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f1f1; 
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1; 
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8; 
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

    <!-- Container Principal -->
    <div class="bg-white rounded-3xl shadow-xl w-full max-w-md overflow-hidden border border-gray-100">
        
        <!-- Cabeçalho -->
        <div class="bg-gray-900 px-6 py-8 text-center text-white">
            <h1 class="text-2xl font-bold tracking-tight">Grade de Aulas</h1>
            <p class="text-gray-400 text-sm mt-2">Selecione uma disciplina para acessar</p>
        </div>

        <!-- Lista de Menu -->
        <nav class="p-6 space-y-4" id="menu-container">
            <!-- Os botões serão injetados aqui pelo JavaScript -->
        </nav>
        
        <div class="bg-gray-50 px-6 py-4 text-center border-t border-gray-100">
            <p class="text-xs text-gray-400">Sistema Acadêmico &copy; 2026</p>
        </div>
    </div>

    <script>
        // Dados extraídos da imagem
        // A Informática Básica foi agrupada em um único item, conforme solicitado.
        const disciplinas = [
            {
                id: 'arq-comp',
                nome: 'Arquitetura de Computadores',
                turmas: 'Inf. Int. 7ºM',
                corBotao: 'hover:border-pink-500 hover:ring-1 hover:ring-pink-500',
                corIcone: 'bg-pink-100 text-pink-600',
                icone: '<svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 3v2m6-2v2M9 19v2m6-2v2M5 9H3m2 6H3m18-6h-2m2 6h-2M7 19h10a2 2 0 002-2V7a2 2 0 00-2-2H7a2 2 0 00-2 2v10a2 2 0 002 2zM9 9h6v6H9V9z"></path></svg>'
            },
            {
                id: 'inf-basica',
                nome: 'Informática Básica',
                turmas: 'Inf. Int. 1ºM (Manhã) • Agro Sub. 1ºN (Noite)', // Agrupado!
                corBotao: 'hover:border-green-500 hover:ring-1 hover:ring-green-500 border-green-200 bg-green-50/30', // Leve destaque
                corIcone: 'bg-green-100 text-green-600',
                icone: '<svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.75 17L9 20l-1 1h8l-1-1-.75-3M3 13h18M5 17h14a2 2 0 002-2V5a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path></svg>'
            },
            {
                id: 'sis-op',
                nome: 'Sistemas Operacionais',
                turmas: 'Lic. Comp. 6ºN',
                corBotao: 'hover:border-yellow-500 hover:ring-1 hover:ring-yellow-500',
                corIcone: 'bg-yellow-100 text-yellow-600',
                icone: '<svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 20l4-16m4 4l4 4-4 4M6 16l-4-4 4-4"></path></svg>'
            },
            {
                id: 'inf-teo',
                nome: 'Informática Teórica',
                turmas: 'Lic. Comp. 2ºN',
                corBotao: 'hover:border-purple-500 hover:ring-1 hover:ring-purple-500',
                corIcone: 'bg-purple-100 text-purple-600',
                icone: '<svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"></path></svg>'
            },
            {
                id: 'org-est',
                nome: 'Organização Estruturada',
                turmas: 'Lic. Comp. 5ºN',
                corBotao: 'hover:border-red-500 hover:ring-1 hover:ring-red-500',
                corIcone: 'bg-red-100 text-red-600',
                icone: '<svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 002-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"></path></svg>'
            }
        ];

        const container = document.getElementById('menu-container');

        // Renderizar botões
        disciplinas.forEach(disc => {
            const btn = document.createElement('a'); // Mudamos de button para tag de link (a)
            // Estrutura do botão com Tailwind
            btn.className = `w-full group flex items-center p-4 bg-white border border-gray-200 rounded-2xl shadow-sm hover:shadow-md transition-all duration-200 text-left cursor-pointer transform hover:-translate-y-1 ${disc.corBotao || ''}`;
            
            // Formatador automático: remove acentos, joga para minúsculo e troca espaços por '_'
            const nomeFormatado = disc.nome.normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase().replace(/\s+/g, '_');
            btn.href = `${nomeFormatado}/index.html`;

            btn.innerHTML = `
                <div class="${disc.corIcone} w-12 h-12 rounded-xl flex items-center justify-center mr-4 flex-shrink-0 transition-transform group-hover:scale-110">
                    ${disc.icone}
                </div>
                <div class="flex-grow">
                    <h2 class="text-base font-semibold text-gray-800 group-hover:text-gray-900">${disc.nome}</h2>
                    <p class="text-xs text-gray-500 mt-1">${disc.turmas}</p>
                </div>
                <div class="text-gray-300 group-hover:text-gray-500 transition-colors">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>
                </div>
            `;
            container.appendChild(btn);
        });
    </script>
</body>
</html>
